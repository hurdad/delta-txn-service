name: CI

# Build + test validation for pull requests -- the counterpart to
# docker-publish.yml (which builds, tests via the same Dockerfile, and
# pushes to GHCR, but only on push to main/tags). Without this, a pull
# request could be reviewed and merged without ever having been built or
# tested by CI at all -- only *after* landing on main, when
# docker-publish.yml runs and (if it fails) publishes nothing, but by then
# the broken change is already on main.
#
# Deliberately does not also trigger on `push: branches: [main]`:
# docker-publish.yml already builds (and, via the Dockerfile's own
# `RUN cargo test --profile release-test` step, tests) every push to main -- adding the
# same trigger here would just build everything a second time for no
# additional signal. `target: builder` stops the build at the same stage
# docker-publish.yml's own multi-stage build passes through on its way to
# the runtime image, so this runs the identical `cargo build --release` +
# `cargo test --profile release-test` steps, just without ever assembling or pushing
# the final runtime image.
on:
  pull_request:

permissions:
  contents: read

jobs:
  # Formatting check via rustfmt (see rustfmt.toml at the repo root for the
  # one setting pinned -- `edition`, matching Cargo.toml's own -- otherwise
  # stock rustfmt defaults). Kept as its own fast job rather than a step in
  # build-and-test: it needs a real Rust toolchain (the Docker-based build
  # job never installs one directly, cargo runs inside the build image),
  # and failing fast on formatting before the much slower Docker build/test
  # job runs saves CI time on a PR that just needs `cargo fmt` re-run.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@2d81d658c8c4093152107cdb91c1e9545a9f992c # 1.94.1
        with:
          toolchain: 1.94.1
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2d81d658c8c4093152107cdb91c1e9545a9f992c # 1.94.1
        with:
          toolchain: 1.94.1
          components: clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  # RustSec advisory check against Cargo.lock. Ignored advisories (each
  # with its reason and removal condition) live in .cargo/audit.toml;
  # "unmaintained" warnings are reported but don't fail the job.
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit

  # Lints the chart and renders it with representative values, including
  # checking that the default (no auth, no allowlist) render is refused.
  helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lint and render the chart
        working-directory: deploy/helm/delta-txn-service
        run: |
          helm lint . --set security.allowInsecure=true
          helm template t . --set grpc.apiKeysSecretName=keys > /dev/null
          helm template t . --set 'security.allowedTablePrefixes[0]=s3://bucket/' \
            --set grpc.tls.enabled=true --set grpc.tls.secretName=tls \
            --set grpc.tls.clientCAFile=ca.crt --set networkPolicy.enabled=true \
            --set telemetry.endpoint=http://otel:4317 > /dev/null
          if helm template t . > /dev/null 2>&1; then
            echo "default render should fail without an API key or allowlist" >&2
            exit 1
          fi

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Shares the same GitHub Actions cache scope as docker-publish.yml's
      # own build (cache-from/cache-to: type=gha is keyed by repo, not by
      # workflow), so a PR build warms the cache the post-merge publish
      # build then reuses, and vice versa.
      - name: Build and test (builder stage -- runs cargo test --release)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: builder
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The Docker-based job above runs tests/ against the file:// filesystem
  # backend only (see tests/README.md) -- fast, dependency-free, and
  # exactly what runs inside the Docker build docker-publish.yml also uses.
  # This job instead runs tests/e2e_s3.rs against a real S3-compatible
  # backend (SeaweedFS): object_store's LocalFileSystem and S3
  # implementations don't share identical semantics (conditional-put
  # behavior in particular, which is exactly what this service's
  # optimistic-concurrency conflict detection depends on), so passing
  # against `file://` alone doesn't prove the same logic is correct against
  # S3-shaped storage. Every other test file under tests/ still only needs
  # `file://` and isn't duplicated here.
  s3-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Started directly rather than via `services:`, which can't pass the
      # `server -s3` arguments the image needs. Single-process SeaweedFS
      # (master + volume + filer + S3 gateway); with no S3 identities
      # configured it accepts any credentials. It supports conditional
      # writes (If-None-Match), which delta-rs's S3 commit protocol needs.
      - name: Start SeaweedFS
        run: |
          docker run -d --name seaweedfs -p 8333:8333 \
            chrislusf/seaweedfs:4.55 server -s3 -dir=/data
          timeout 60 bash -c 'until curl -s -o /dev/null http://localhost:8333/; do sleep 1; done'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2d81d658c8c4093152107cdb91c1e9545a9f992c # 1.94.1
        with:
          toolchain: 1.94.1

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Matches the Dockerfile's own builder-stage apt-get install:
      # protobuf-compiler for tonic-prost-build's protoc invocation. No
      # OpenSSL packages: TLS is rustls throughout.
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Create the test bucket
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: aws --endpoint-url http://localhost:8333 --region us-east-1 s3 mb s3://delta-txn-service-ci

      - name: Run S3-backed integration tests
        env:
          AWS_ENDPOINT_URL: http://localhost:8333
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          AWS_ALLOW_HTTP: "true"
          DELTA_TXN_TEST_S3_BUCKET: delta-txn-service-ci
        run: cargo test --locked --test e2e_s3
