name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# Without this, every push to main queues its own full multi-arch build
# (each historically ~4 hours -- QEMU-emulated arm64 plus the Dockerfile's
# own `cargo test --release` gate) rather than superseding the previous
# one. Several stacked at once contend for the same `cache-to: type=gha`
# cache and GHCR push, which is exactly what caused four runs to all miss
# GitHub Actions' 6-hour job timeout and get auto-cancelled instead of
# any of them finishing. Only the latest commit's image matters anyway.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU was only needed to emulate arm64; not required while that
      # platform is disabled below.
      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 disabled: QEMU-emulated arm64 was the dominant cost in the
          # ~4-hour multi-arch build time that's been blowing the 6-hour CI
          # timeout. Re-enable (and restore the QEMU step above) once build
          # time is under control, e.g. via native arm64 runners.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
