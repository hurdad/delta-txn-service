version: "3.9"

services:
  delta-txn-service:
    image: delta-txn-service:local
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "50051:50051"
    environment:
      DELTA_TXN_GRPC_ADDR: "0.0.0.0:50051"
      # Local dev only: the service refuses to start with neither an API
      # key nor a table allowlist unless this is set.
      DELTA_TXN_ALLOW_INSECURE: "true"
      AWS_ENDPOINT_URL: "http://seaweedfs:8333"
      # SeaweedFS below has no S3 identities configured, so it accepts any
      # credentials; delta-rs still needs some to sign requests.
      AWS_ACCESS_KEY_ID: "dev"
      AWS_SECRET_ACCESS_KEY: "dev"
      AWS_REGION: "us-east-1"
      AWS_ALLOW_HTTP: "true"
    depends_on:
      - seaweedfs

  # Single-process SeaweedFS (master + volume + filer + S3 gateway on
  # 8333). Supports the conditional writes delta-rs's S3 commits need.
  seaweedfs:
    image: chrislusf/seaweedfs:4.55
    command: server -s3 -dir=/data
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs-data:/data

volumes:
  seaweedfs-data:
