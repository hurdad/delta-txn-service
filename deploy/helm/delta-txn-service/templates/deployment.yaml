{{- $hasKey := or .Values.grpc.apiKey .Values.grpc.apiKeySecretName .Values.grpc.apiKeysSecretName }}
{{- if and (not $hasKey) (not .Values.security.allowedTablePrefixes) (not .Values.security.allowInsecure) }}
{{- fail "No API key (grpc.apiKey / grpc.apiKeySecretName / grpc.apiKeysSecretName) and no security.allowedTablePrefixes are set, so any client could read and write any table. Configure one of them, or set security.allowInsecure=true for a throwaway test cluster." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "delta-txn-service.fullname" . }}
  labels:
    {{- include "delta-txn-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "delta-txn-service.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "delta-txn-service.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: delta-txn-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          # Checks the delta.txn.v1.DeltaTxnService-specific status, not
          # the overall-server default -- when AWS_ENDPOINT_URL is set
          # (main.rs's own spawn_storage_health_probe), that status
          # reflects real object-store reachability, so a storage outage
          # pulls this pod out of the Service's endpoints without
          # restarting it.
          readinessProbe:
            grpc:
              port: {{ .Values.service.port }}
              service: "delta.txn.v1.DeltaTxnService"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          # Deliberately checks the overall-server default status (no
          # `service:` field), not delta.txn.v1.DeltaTxnService -- unlike
          # readiness above, liveness must stay independent of storage
          # reachability: restarting this pod doesn't fix a downstream
          # storage outage, and cycling pods repeatedly during one is its
          # own antipattern. This only ever reflects "is the process
          # itself alive and serving gRPC," which is what should decide
          # whether Kubernetes restarts it.
          livenessProbe:
            grpc:
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
          env:
            - name: DELTA_TXN_GRPC_ADDR
              value: "{{ .Values.grpc.address }}"
            {{- if .Values.grpc.apiKeySecretName }}
            - name: DELTA_TXN_GRPC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.grpc.apiKeySecretName }}
                  key: {{ .Values.grpc.apiKeySecretKey | default "api-key" }}
            {{- else if .Values.grpc.apiKey }}
            - name: DELTA_TXN_GRPC_API_KEY
              value: {{ .Values.grpc.apiKey | quote }}
            {{- end }}
            {{- if .Values.grpc.apiKeysSecretName }}
            - name: DELTA_TXN_GRPC_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.grpc.apiKeysSecretName }}
                  key: {{ .Values.grpc.apiKeysSecretKey | default "api-keys" }}
            {{- end }}
            {{- if .Values.grpc.tls.enabled }}
            - name: DELTA_TXN_GRPC_TLS_CERT
              value: "{{ .Values.grpc.tls.mountPath }}/{{ .Values.grpc.tls.certFile }}"
            - name: DELTA_TXN_GRPC_TLS_KEY
              value: "{{ .Values.grpc.tls.mountPath }}/{{ .Values.grpc.tls.keyFile }}"
            {{- if .Values.grpc.tls.clientCAFile }}
            - name: DELTA_TXN_GRPC_TLS_CLIENT_CA
              value: "{{ .Values.grpc.tls.mountPath }}/{{ .Values.grpc.tls.clientCAFile }}"
            {{- end }}
            {{- end }}
            {{- with .Values.grpc.requestTimeoutSeconds | toString }}{{ if . }}
            - name: DELTA_TXN_GRPC_REQUEST_TIMEOUT_SECS
              value: {{ . | quote }}
            {{- end }}{{ end }}
            {{- with .Values.grpc.maxConcurrentRequestsPerConnection | toString }}{{ if . }}
            - name: DELTA_TXN_GRPC_MAX_CONCURRENT_REQUESTS_PER_CONNECTION
              value: {{ . | quote }}
            {{- end }}{{ end }}
            {{- with .Values.grpc.maxMessageBytes | toString }}{{ if . }}
            - name: DELTA_TXN_GRPC_MAX_MESSAGE_BYTES
              value: {{ . | quote }}
            {{- end }}{{ end }}
            {{- with .Values.grpc.maxActionsPerCommit | toString }}{{ if . }}
            - name: DELTA_TXN_MAX_ACTIONS_PER_COMMIT
              value: {{ . | quote }}
            {{- end }}{{ end }}
            {{- with .Values.grpc.snapshotCacheSize | toString }}{{ if . }}
            - name: DELTA_TXN_SNAPSHOT_CACHE_SIZE
              value: {{ . | quote }}
            {{- end }}{{ end }}
            {{- with .Values.grpc.snapshotCacheTtlSeconds | toString }}{{ if . }}
            - name: DELTA_TXN_SNAPSHOT_CACHE_TTL_SECS
              value: {{ . | quote }}
            {{- end }}{{ end }}
            {{- range $key, $value := .Values.storage.aws }}
            {{- if and $value (ne $key "AWS_ACCESS_KEY_ID") (ne $key "AWS_SECRET_ACCESS_KEY") }}
            - name: {{ $key }}
              value: "{{ $value }}"
            {{- end }}
            {{- end }}
            {{- if and .Values.storage.credentialsSecretName (or .Values.storage.aws.AWS_ACCESS_KEY_ID .Values.storage.aws.AWS_SECRET_ACCESS_KEY) }}
            {{- fail "storage.credentialsSecretName is set but storage.aws.AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY are also non-empty -- clear those plaintext values (they'd otherwise sit unused but still stored in plaintext in the Helm release)." }}
            {{- end }}
            {{- if .Values.storage.credentialsSecretName }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.credentialsSecretName }}
                  key: {{ .Values.storage.accessKeyIdSecretKey | default "AWS_ACCESS_KEY_ID" }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.credentialsSecretName }}
                  key: {{ .Values.storage.secretAccessKeySecretKey | default "AWS_SECRET_ACCESS_KEY" }}
            {{- else }}
            {{- if .Values.storage.aws.AWS_ACCESS_KEY_ID }}
            - name: AWS_ACCESS_KEY_ID
              value: "{{ .Values.storage.aws.AWS_ACCESS_KEY_ID }}"
            {{- end }}
            {{- if .Values.storage.aws.AWS_SECRET_ACCESS_KEY }}
            - name: AWS_SECRET_ACCESS_KEY
              value: "{{ .Values.storage.aws.AWS_SECRET_ACCESS_KEY }}"
            {{- end }}
            {{- end }}
            {{- if .Values.security.allowedTablePrefixes }}
            - name: DELTA_TXN_ALLOWED_TABLE_PREFIXES
              value: "{{ join "," .Values.security.allowedTablePrefixes }}"
            {{- end }}
            {{- if .Values.security.allowInsecure }}
            - name: DELTA_TXN_ALLOW_INSECURE
              value: "true"
            {{- end }}
            - name: RUST_LOG
              value: {{ .Values.logging.level | quote }}
            - name: DELTA_TXN_LOG_FORMAT
              value: {{ .Values.logging.format | quote }}
            {{- if .Values.telemetry.serviceName }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.telemetry.serviceName | quote }}
            {{- end }}
            {{- if .Values.telemetry.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.telemetry.endpoint | quote }}
            {{- end }}
            {{- if .Values.telemetry.tracesEndpoint }}
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: {{ .Values.telemetry.tracesEndpoint | quote }}
            {{- end }}
            {{- if .Values.telemetry.metricsEndpoint }}
            - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              value: {{ .Values.telemetry.metricsEndpoint | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.grpc.tls.enabled }}
            - name: grpc-tls
              mountPath: "{{ .Values.grpc.tls.mountPath }}"
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.grpc.tls.enabled }}
        - name: grpc-tls
          secret:
            secretName: {{ .Values.grpc.tls.secretName }}
        {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: {{ .Values.topologySpread.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "delta-txn-service.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
      {{- end }}
