replicaCount: 1

image:
  repository: delta-txn-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 50051

grpc:
  address: "0.0.0.0:50051"
  # WARNING: apiKey is rendered in plaintext into the Deployment's env vars and is
  # stored in plaintext in the Helm release. Use apiKeySecretName for anything
  # beyond local testing.
  apiKey: ""
  apiKeySecretName: ""
  apiKeySecretKey: ""
  tls:
    enabled: false
    secretName: ""
    certFile: "tls.crt"
    keyFile: "tls.key"
    mountPath: "/etc/delta-txn/tls"

storage:
  aws:
    AWS_ENDPOINT_URL: ""
    AWS_ACCESS_KEY_ID: ""
    AWS_SECRET_ACCESS_KEY: ""
    AWS_REGION: ""
    AWS_ALLOW_HTTP: ""

security:
  # Comma-joined into DELTA_TXN_ALLOWED_TABLE_PREFIXES. Empty means any table_uri
  # a client supplies is permitted (unrestricted, historical behavior).
  allowedTablePrefixes: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}

tolerations: []

affinity: {}
