# 2, not 1: the service is stateless (safe to run multiple replicas --
# see the root README's "Concurrency model") and a single replica means
# every deploy/node-drain/crash is a full outage with no traffic to fail
# over to. Bump further for real production load; 2 is the minimum for
# "a rolling deploy doesn't mean zero replicas serving."
replicaCount: 2

# Keeps at least one pod available during voluntary disruptions (a
# `kubectl drain`, cluster autoscaler node removal, etc.) -- irrelevant at
# replicaCount: 1 (nothing to keep available), so this only starts doing
# anything once you've scaled past that.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

image:
  repository: delta-txn-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 50051

grpc:
  address: "0.0.0.0:50051"
  # WARNING: apiKey is rendered in plaintext into the Deployment's env vars and is
  # stored in plaintext in the Helm release. Use apiKeySecretName for anything
  # beyond local testing.
  apiKey: ""
  apiKeySecretName: ""
  apiKeySecretKey: ""
  tls:
    enabled: false
    secretName: ""
    certFile: "tls.crt"
    keyFile: "tls.key"
    mountPath: "/etc/delta-txn/tls"

storage:
  aws:
    AWS_ENDPOINT_URL: ""
    # WARNING: AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY below are rendered in
    # plaintext into the Deployment's env vars and stored in plaintext in the
    # Helm release, same as grpc.apiKey above. Use credentialsSecretName for
    # anything beyond local testing, and leave these two blank when you do --
    # the chart refuses to render (via `fail`) if both are set at once, so a
    # migration to credentialsSecretName can't accidentally leave stale
    # plaintext credentials sitting in the release's stored values.
    AWS_ACCESS_KEY_ID: ""
    AWS_SECRET_ACCESS_KEY: ""
    AWS_REGION: ""
    AWS_ALLOW_HTTP: ""
  credentialsSecretName: ""
  accessKeyIdSecretKey: "AWS_ACCESS_KEY_ID"
  secretAccessKeySecretKey: "AWS_SECRET_ACCESS_KEY"

security:
  # Comma-joined into DELTA_TXN_ALLOWED_TABLE_PREFIXES. Empty means any table_uri
  # a client supplies is permitted (unrestricted, historical behavior).
  allowedTablePrefixes: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Conservative starting points, not load-tested numbers -- this service's
# dependency stack (Arrow/DataFusion/Parquet, pulled in transitively by
# deltalake's own schema-parsing and ListActiveFiles' snapshot/file-listing
# path) has a materially heavier memory footprint per request than a plain
# CRUD service, and a big ListActiveFiles response (many thousands of
# files, each carrying decoded per-column stats -- see FILE_BATCH_SIZE in
# grpc/server.rs) or several concurrent Commits can spike well past what a
# minimal-looking limit implies. Profile against your own table sizes and
# commit/list traffic before trusting these at real scale; treat a change
# here as "adjust based on measurement," not "these are already right."
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

nodeSelector: {}

tolerations: []

affinity: {}
