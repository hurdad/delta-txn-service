# 2, not 1: the service is stateless (safe to run multiple replicas --
# see the root README's "Concurrency model") and a single replica means
# every deploy/node-drain/crash is a full outage with no traffic to fail
# over to. Bump further for real production load; 2 is the minimum for
# "a rolling deploy doesn't mean zero replicas serving."
replicaCount: 2

# Keeps at least one pod available during voluntary disruptions (a
# `kubectl drain`, cluster autoscaler node removal, etc.) -- irrelevant at
# replicaCount: 1 (nothing to keep available), so this only starts doing
# anything once you've scaled past that.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

image:
  repository: delta-txn-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 50051

grpc:
  address: "0.0.0.0:50051"
  # WARNING: apiKey is rendered in plaintext into the Deployment's env vars and is
  # stored in plaintext in the Helm release. Use apiKeySecretName for anything
  # beyond local testing.
  apiKey: ""
  apiKeySecretName: ""
  apiKeySecretKey: ""
  # Named keys (DELTA_TXN_GRPC_API_KEYS), read from a Secret: the value at
  # apiKeysSecretKey is a comma-separated `name=key` list, e.g.
  # "ingest=...,reader=...". List the old and new key while rotating.
  apiKeysSecretName: ""
  apiKeysSecretKey: "api-keys"
  tls:
    enabled: false
    secretName: ""
    certFile: "tls.crt"
    keyFile: "tls.key"
    # Mutual TLS: the file (in the same secret) holding the CA that client
    # certificates must chain to, e.g. "ca.crt" for a cert-manager secret.
    # Empty disables client-certificate checks.
    clientCAFile: ""
    mountPath: "/etc/delta-txn/tls"
  # Empty values keep the service's defaults (see README "Configuration").
  requestTimeoutSeconds: ""
  maxConcurrentRequestsPerConnection: ""
  maxMessageBytes: ""
  maxActionsPerCommit: ""

storage:
  aws:
    AWS_ENDPOINT_URL: ""
    # WARNING: AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY below are rendered in
    # plaintext into the Deployment's env vars and stored in plaintext in the
    # Helm release, same as grpc.apiKey above. Use credentialsSecretName for
    # anything beyond local testing, and leave these two blank when you do --
    # the chart refuses to render (via `fail`) if both are set at once, so a
    # migration to credentialsSecretName can't accidentally leave stale
    # plaintext credentials sitting in the release's stored values.
    AWS_ACCESS_KEY_ID: ""
    AWS_SECRET_ACCESS_KEY: ""
    AWS_REGION: ""
    AWS_ALLOW_HTTP: ""
  credentialsSecretName: ""
  accessKeyIdSecretKey: "AWS_ACCESS_KEY_ID"
  secretAccessKeySecretKey: "AWS_SECRET_ACCESS_KEY"

security:
  # Comma-joined into DELTA_TXN_ALLOWED_TABLE_PREFIXES. Empty means any table_uri
  # a client supplies is permitted.
  allowedTablePrefixes: []
  # The service refuses to start with neither an API key nor an allowlist.
  # The chart fails to render in that case too, unless this is true
  # (DELTA_TXN_ALLOW_INSECURE) -- for throwaway test clusters only.
  allowInsecure: false

logging:
  # RUST_LOG filter.
  level: "info"
  # "json" for one JSON object per line, or "text".
  format: "json"

telemetry:
  # OTLP export over gRPC. Point endpoint at the collector's gRPC port
  # (usually 4317). Empty endpoints leave export off.
  serviceName: "delta-txn-service"
  endpoint: ""
  tracesEndpoint: ""
  metricsEndpoint: ""

# Extra container env vars, rendered as-is (a list of EnvVar objects,
# including valueFrom). For anything the values above don't cover.
extraEnv: []

networkPolicy:
  # Restricts ingress to the gRPC port from the listed peers. Egress is not
  # restricted (object-store endpoints vary too much to template here).
  enabled: false
  # NetworkPolicy `from` entries, e.g.:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: data-pipelines
  # Empty with enabled=true allows only pods in the release namespace.
  ingressFrom: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Conservative starting points, not load-tested numbers -- this service's
# dependency stack (Arrow/Parquet, pulled in transitively by
# deltalake's own schema-parsing and ListActiveFiles' snapshot/file-listing
# path) has a materially heavier memory footprint per request than a plain
# CRUD service, and a big ListActiveFiles response (many thousands of
# files, each carrying decoded per-column stats -- see FILE_BATCH_SIZE in
# grpc/server.rs) or several concurrent Commits can spike well past what a
# minimal-looking limit implies. Profile against your own table sizes and
# commit/list traffic before trusting these at real scale; treat a change
# here as "adjust based on measurement," not "these are already right."
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Spread replicas across nodes so one node failure can't take them all.
# ScheduleAnyway keeps single-node clusters schedulable; use DoNotSchedule
# for a hard guarantee. The chart fills in the label selector.
topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway
