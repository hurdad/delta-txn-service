[package]
name = "delta-txn-service"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
# -----------------------------
# Async runtime
# -----------------------------
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal"] }
# ReceiverStream, adapting a tokio::sync::mpsc::Receiver into the
# futures_core::Stream ListActiveFiles' server-streaming response needs.
# `net`: TcpListenerStream, used only by the integration test harness
# (tests/common/mod.rs) to serve on an OS-assigned ephemeral port and learn
# its actual address before handing the listener to tonic.
tokio-stream = { version = "0.1.17", features = ["net"] }

# -----------------------------
# gRPC / Protobuf
# -----------------------------
tonic = { version = "0.14.3", features = ["tls-ring"] }
tonic-prost = "0.14.3"
prost = "0.14.3"
prost-types = "0.14.3"
# The standard grpc.health.v1.Health service, unauthenticated (added
# alongside DeltaTxnServiceServer in main.rs, not behind
# make_auth_interceptor) -- lets Kubernetes/other orchestrators use a real
# gRPC health probe instead of a bare TCP-connect check, without needing to
# supply an API key from a liveness/readiness probe.
tonic-health = "0.14.6"
tower = "0.5.3"
http-body = "1.0.1"
# Safe Pin projection for MetricsBody (telemetry/metrics.rs) -- already
# resolved transitively (tonic/tower's own dependency graph pulls it in),
# declared directly here since this crate's own code now uses its
# `pin_project!` macro too.
pin-project-lite = "0.2.17"

# -----------------------------
# Delta Lake (native)
# -----------------------------
deltalake = { version = "0.32.4", features = ["s3", "datafusion"] }
# Already resolved transitively (deltalake's own table_uri/log_store types
# use it); declared directly since delta::table::table_exists and
# delta::commit::create_table now name `url::Url` themselves rather than
# only ever passing it through opaquely.
url = "2.5.8"

# -----------------------------
# Concurrency / locking
# -----------------------------
dashmap = "6.1.0"

# -----------------------------
# Serialization / utilities
# -----------------------------
thiserror = "2.0.18"
serde_json = "1.0.149"

# -----------------------------
# Observability
# -----------------------------
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tracing-opentelemetry = "0.33.0"
opentelemetry = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic", "http-json", "http-proto", "tls"] }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }

[build-dependencies]
tonic-prost-build = "0.14.3"

[dev-dependencies]
# tests/ (the gRPC integration test suite) creates each test's Delta table
# under a throwaway `file://` tempdir -- no S3/MinIO dependency, so the
# suite runs anywhere `cargo test` does, including the Docker build's own
# `RUN cargo test --release` step.
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

# `cargo test --release` builds test binaries against [profile.release]
# directly (verified against cargo 1.94.1 -- there is no separate `bench`
# profile indirection to override here). Fat LTO + a single codegen unit
# for every test binary, on top of the already-massive deltalake+datafusion
# dependency graph, is enough peak memory during linking to OOM a Docker
# build (this crashed WSL2). Test binaries only need to be correct, not
# link-time-optimized, so the Dockerfile and ci.yml invoke
# `cargo test --profile release-test` instead of `--release`, picking up
# this profile, which turns both off.
[profile.release-test]
inherits = "release"
lto = false
codegen-units = 16
